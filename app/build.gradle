plugins {
    id 'com.android.application'
}

android {
    namespace 'mx.iadesign.cometqr'
    compileSdk 35

    defaultConfig {
        applicationId 'mx.iadesign.cometqr'
        minSdk 23
        targetSdk 35
        versionCode 15
        versionName '0.12.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

def iconBase64File = file('src/main/icon.b64')
def generatedIconFile = file('src/main/res/drawable-nodpi/app_icon.webp')
def generatedAssetIconFile = file('src/main/assets/app_icon.webp')

tasks.register('generateAppIcon') {
    inputs.file(iconBase64File)
    outputs.files(generatedIconFile, generatedAssetIconFile)
    doLast {
        byte[] decoded = java.util.Base64.getMimeDecoder().decode(iconBase64File.text.trim())
        generatedIconFile.parentFile.mkdirs()
        generatedAssetIconFile.parentFile.mkdirs()
        generatedIconFile.bytes = decoded
        generatedAssetIconFile.bytes = decoded
    }
}

tasks.named('preBuild').configure {
    dependsOn('generateAppIcon')
}

dependencies {
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
}
