name: Compilar APK COMET QR

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK debug
        run: gradle --no-daemon assembleDebug

      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk COMET-QR-V0.5.1.apk

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: COMET-QR-V0.5.1-APK
          path: COMET-QR-V0.5.1.apk
          if-no-files-found: error
